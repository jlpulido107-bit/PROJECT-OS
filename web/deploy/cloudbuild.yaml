# PROJECT-OS V1.3 — build manual en Cloud Build (solo construye y sube la imagen; NO despliega).
# Uso (desde la raíz del repo, tras autorización): ver docs/despliegue-privado-v1-3.md §5.5
#   gcloud builds submit web --config web/deploy/cloudbuild.yaml --substitutions=_IMAGE_TAG="$IMAGE_TAG"
steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args: ['build', '--platform', 'linux/amd64', '-t', '${_IMAGE_TAG}', '.']
images:
  - '${_IMAGE_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
