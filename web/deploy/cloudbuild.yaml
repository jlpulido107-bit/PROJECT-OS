# PROJECT-OS V1.6 — build manual en Cloud Build (solo construye y sube la imagen; NO despliega).
# Uso (tras autorización): ver docs/despliegue-privado-v1-3.md §5.5. El comando lo genera y valida
#   node web/deploy/build-command.mjs
# e incluye SIEMPRE --service-account con la cuenta dedicada project-os-build@PROJECT_ID.iam.gserviceaccount.com.
#
# Identidad exigida: el primer paso consulta al metadata server con qué cuenta corre el build y lo aborta,
# antes de construir o subir nada, si no es la cuenta dedicada (p. ej. la cuenta predeterminada de Compute o la
# heredada de Cloud Build, que pueden tener rol Editor). Con una cuenta propia, Cloud Build exige que los logs vayan
# a Cloud Logging o a un bucket propio: aquí, solo Cloud Logging (la cuenta necesita roles/logging.logWriter).
steps:
  - id: verificar-identidad
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        expected="project-os-build@$PROJECT_ID.iam.gserviceaccount.com"
        actual="$$(curl -sSf -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/email')"
        if [ "$$actual" != "$$expected" ]; then
          echo "Build abortado: la identidad de compilación no es la cuenta dedicada project-os-build." >&2
          exit 1
        fi
        echo "Identidad de compilación verificada: cuenta dedicada project-os-build."
  - id: construir-imagen
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args: ['build', '--platform', 'linux/amd64', '-t', '${_IMAGE_TAG}', '.']
images:
  - '${_IMAGE_TAG}'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
