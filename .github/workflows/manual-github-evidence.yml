name: PROJECT-OS — Manual GitHub evidence report
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "YYYY-MM-DD; empty = current day in America/Merida"
        required: false
        type: string
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate evidence report
        env:
          GH_READ_TOKEN: ${{ secrets.PROJECT_OS_GH_READ_TOKEN }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: python src/collect_activity.py
      - name: Commit generated reports
        run: |
          git config user.name 'project-os-bot'
          git config user.email 'project-os-bot@users.noreply.github.com'
          git add reports/
          git diff --cached --quiet || (git commit -m 'docs: add PROJECT-OS GitHub evidence report' && git push)
