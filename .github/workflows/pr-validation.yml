name: PROJECT-OS — PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m compileall -q src tests
      - name: Validate project configuration
        run: python -m json.tool config/projects.json > /dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test GitHub API against PROJECT-OS (read-only)
        env:
          GH_READ_TOKEN: ${{ github.token }}
          REPORT_PROJECT_IDS: POS
        run: python src/collect_activity.py
      # Un PR nunca recibe credenciales de Google ni lee la hoja real (revisión R3-1 del PR #24): aquí se ejecuta el
      # código del propio PR, y un dry-run es una opción de ese código, no una barrera de permisos. El esquema y la
      # sincronización se validan con una hoja EN MEMORIA; la validación con la hoja real es una operación humana aparte,
      # opcional y autorizada (docs/sheets-sync-setup.md). El preflight P12 da FALLO si vuelve una credencial.
      - name: Sheets sync dry-run against an in-memory sheet (no credentials, no network)
        run: python tests/sheets_fixture_dry_run.py
      - name: Preserve smoke report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-os-api-smoke-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
