name: PROJECT-OS — PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate syntax
        run: python -m compileall -q src tests
      - name: Validate project configuration
        run: python -m json.tool config/projects.json > /dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test GitHub API against PROJECT-OS (read-only)
        env:
          GH_READ_TOKEN: ${{ github.token }}
          REPORT_PROJECT_IDS: POS
        run: python src/collect_activity.py
      - name: Preserve smoke report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-os-api-smoke-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: error
